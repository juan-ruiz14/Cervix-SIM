name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements-mongo.txt
      - name: Validar banco de casos
        run: cd backend && python -m cervix_sim.tools.validate_cases
      - name: Pruebas
        run: cd backend && python -m unittest discover -s tests -t .
        env: { MONGODB_URI: "mongodb://localhost:27017" }
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: for f in frontend/js/*.js frontend/js/views/*.js; do node --check "$f"; done
